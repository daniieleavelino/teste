<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#F7F4EE">
  <title>Módulo 1 | LinQ Mentoria Linguística</title>

  <!-- Importação das Fontes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@1,700&family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Conectando ao seu CSS existente -->
  <link rel="stylesheet" href="style.css">

  <link rel="icon" type="image/png" sizes="32x32" href="imagens/favicon_io/favicon-32x32.png">
</head>

<body>
  <!-- Cabeçalho Minimalista para a Área de Alunos -->
  <header class="site-header" id="topo">
    <div class="container nav-container" style="align-items: center;">
      
      <!-- Logo à esquerda -->
      <a class="brand" href="index.html" aria-label="LinQ Mentoria Linguística - Início">
        <img src="imagens/logo-header.webp" alt="Logo LinQ Mentoria Linguística" class="logo" />
        <span class="brand-text">
          <img src="imagens/linq-wordmark.svg" alt="LinQ" class="wordmark wordmark-header" />
          <span class="brand-sub">MENTORIA LINGUÍSTICA</span>
        </span>
      </a>

    

    </div>
  </header>

  <!-- Área da Aula com o Genially -->
  <main id="main-content" style="padding-top: 6rem; padding-bottom: 4rem; background: var(--bg-soft);">
    <section class="section" style="padding: 2rem 0;">
      <div class="container">
        
        <!-- Título da Aula -->
        <div style="text-align: center; margin-bottom: 2rem;">
          <h1 style="color: var(--text-main); font-size: clamp(1.8rem, 3vw, 2.8rem);">Módulo 1</h1>
          <p class="lead" style="margin: 0 auto; color: var(--text-gold);">Apresentação e Primeiros Passos no Espanhol Corporativo</p>
        </div>

        <!-- Moldura do Genially usando as variáveis do seu CSS -->
        <div style="width: 100%; max-width: 1000px; margin: 0 auto; border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); background: var(--white);">
          
          <!-- AQUI ENTRA O LINK DO GENIALLY DA CLIENTE -->
          <iframe 
            src="https://view.genially.com/68fbccf6ed7c54d122d1c7dc" 
            width="100%" 
            height="650px" 
            style="border: none;" 
            allowfullscreen="true">
          </iframe>
          
        </div>

        <!-- Botão para voltar ao site -->
        <div style="text-align: center; margin-top: 3rem;">
          <a class="btn btn-secondary" href="index.html">Voltar para a Página Inicial</a>
        </div>

      </div>
    </section>
  </main>

  <!-- Rodapé (Idêntico ao da Landing Page) -->
  <footer class="site-footer" role="contentinfo">
    <div class="container footer-inner">
      <p>© <span id="year"></span> <img src="imagens/linq-wordmark.svg" alt="LinQ" class="wordmark wordmark-inline" /> Mentoria Linguística. Todos os direitos reservados | <a href="privacidade.html" class="text-light-gray text-decoration-none" style="opacity: 0.7;">Política de Privacidade</a></p>
    </div>
  </footer>

  <!-- Script principal para o menu mobile e ano do footer continuarem funcionando -->
  <script src="script.js"></script>
</body>

</html>
